name: Hosted Windows compile only

on:
  pull_request:
    paths:
      - '.github/workflows/hosted-compile.yml'
      - 'scripts/Test-ProductBuildBoundary.ps1'
      - 'scripts/Assert-ProjectSecurityClearance.ps1'
      - 'scripts/Build*.ps1'
      - 'scripts/Build*.cmd'
      - 'scripts/Build*.bat'
      - 'src/ProtectionLifecycle/**'
      - 'src/ProtectionBroker/**'
      - 'src/Shared/**'
      - 'src/ClaudeProtection/**'
      - 'src/ClaudeProtection.Engineering/**'
      - 'src/ProtectionCenter/**'
      - 'src/ProtectionBootstrap/**'
      - 'samples/TextSummary/**'
      - 'tests/WfpReadStatus/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-execution-build:
    name: Compile all product projects without running
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Verify product build and security-stop boundary (static only)
        shell: pwsh
        run: ./scripts/Test-ProductBuildBoundary.ps1
      - name: Compile source, do not run protected code
        shell: pwsh
        run: |
          foreach ($project in 'ClaudeProtection','ClaudeProtection.Engineering','ProtectionBroker','ProtectionCenter','ProtectionBootstrap') {
            dotnet build "src/$project/$project.csproj" --configuration Release --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify machine egress rule definitions in memory
        run: dotnet run --project tests/WfpReadStatus/WfpReadStatus.csproj --configuration Release -- --check-machine-egress-policy
