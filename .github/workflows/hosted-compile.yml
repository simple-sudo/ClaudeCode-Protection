name: Hosted Windows compile only

on:
  pull_request:
    paths:
      - '.github/workflows/hosted-compile.yml'
      - 'src/ProtectionLifecycle/**'
      - 'src/ProtectionBroker/**'
      - 'src/Shared/**'
      - 'src/ClaudeProtection/**'
      - 'src/ClaudeProtection.Engineering/**'
      - 'src/ProtectionCenter/**'
      - 'src/ProtectionBootstrap/**'
      - 'samples/TextSummary/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-execution-build:
    name: Compile all product projects without running
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile source, do not run protected code
        shell: pwsh
        run: |
          foreach ($project in 'ClaudeProtection','ClaudeProtection.Engineering','ProtectionBroker','ProtectionCenter','ProtectionBootstrap') {
            dotnet build "src/$project/$project.csproj" --configuration Release --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
