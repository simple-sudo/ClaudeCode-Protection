name: Safe managed policy smoke

on:
  pull_request:
    paths:
      - '.github/workflows/policy-smoke.yml'
      - 'src/ClaudeProtection/StrictPreflight.cs'
      - 'src/ClaudeProtection/DiagnosticNetworkTargetPolicy.cs'
      - 'src/ClaudeProtection/Models.cs'
      - 'src/ClaudeProtection/EnvironmentAudit.cs'
      - 'src/ClaudeProtection/Program.cs'
      - 'src/ClaudeProtection/ClaudeProtection.csproj'
      - 'src/Shared/**'
      - 'src/ProtectionCenter/PreflightDisplay.cs'
      - 'src/ProtectionLifecycle/GatewayDestinationGuard.cs'
      - 'tests/PolicySmoke/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-policy-only:
    name: Pure managed logic (no native product)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run only source-linked managed policy smoke
        run: dotnet run --project tests/PolicySmoke/PolicySmoke.csproj --configuration Release

  hosted-daily-compile:
    name: Compile daily CLI only (never execute product)
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile user-level daily project
        shell: pwsh
        run: dotnet build src/ClaudeProtection/ClaudeProtection.csproj --configuration Release --nologo
