name: Offline workspace Git workflow verification

on:
  pull_request:
    paths:
      - '.github/workflows/workspace-git-workflow.yml'
      - 'src/Shared/WorkspaceBundle.cs'
      - 'src/Shared/WorkspaceFiles.cs'
      - 'src/ProtectionLifecycle/**'
      - 'src/ClaudeProtection/**'
      - 'src/ProtectionCenter/**'
      - 'tests/WorkspaceTransfer/**'
      - 'tests/OwnedToolLaunch/**'
      - 'tests/WorkspacePipe/**'
      - 'tests/CenterResults/**'
      - 'docs/WORKSPACE-TRANSFER.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-managed-verification:
    name: Build products and run offline Git policy tests
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile all product projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(
            'src/ClaudeProtection/ClaudeProtection.csproj',
            'src/ClaudeProtection.Engineering/ClaudeProtection.Engineering.csproj',
            'src/ProtectionBroker/ProtectionBroker.csproj',
            'src/ProtectionCenter/ProtectionCenter.csproj',
            'src/ProtectionBootstrap/ProtectionBootstrap.csproj'
          )
          foreach ($project in $projects) {
            dotnet build $project --configuration Release --nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Compile focused managed test harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tests/WorkspaceTransfer/WorkspaceTransfer.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/OwnedToolLaunch/OwnedToolLaunch.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/WorkspacePipe/WorkspacePipe.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/CenterResults/CenterResults.csproj --configuration Release --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run workspace and Git policy tests as a standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $user = 'cpcgit' + [Guid]::NewGuid().ToString('N').Substring(0, 8)
          $account = "$env:COMPUTERNAME\$user"
          $bytes = [byte[]]::new(32)
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = ConvertTo-SecureString ('Aa1!' + [Convert]::ToBase64String($bytes)) -AsPlainText -Force
          $stage = Join-Path $env:ProgramData ("cpc-git-policy-" + $user)
          $workspaceApp = Join-Path $stage 'workspace-app'
          $ownedApp = Join-Path $stage 'owned-app'
          $workspacePipeApp = Join-Path $stage 'workspace-pipe-app'
          $centerApp = Join-Path $stage 'center-results-app'
          $fixture = Join-Path $stage 'fixture'
          $source = Join-Path $fixture 'source'
          $task = Join-Path $fixture 'task'
          $outside = Join-Path $fixture 'outside'
          $temp = Join-Path $stage 'temp'
          $sourceRedirect = Join-Path $source 'redirect'
          $redirectOutput = Join-Path $fixture 'redirect-output'
          try {
            New-LocalUser -Name $user -Password $password -PasswordNeverExpires -AccountNeverExpires -Description 'Ephemeral non-admin managed test account' | Out-Null
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class CpcUserProfileNative {
            [DllImport("userenv.dll", CharSet=CharSet.Unicode, ExactSpelling=true)]
            public static extern int CreateProfile(
              [MarshalAs(UnmanagedType.LPWStr)] string userSid,
              [MarshalAs(UnmanagedType.LPWStr)] string userName,
              [Out, MarshalAs(UnmanagedType.LPWStr)] StringBuilder profilePath,
              uint cchProfilePath);
          }
          '@
            $sid = (Get-LocalUser -Name $user).SID.Value
            $profileBuffer = [System.Text.StringBuilder]::new(260)
            $profileResult = [CpcUserProfileNative]::CreateProfile($sid,$user,$profileBuffer,[uint32]$profileBuffer.Capacity)
            if ($profileResult -ne 0) { throw ('CreateProfile failed with HRESULT 0x{0}' -f $profileResult.ToString('X8')) }
            $profilePath = $profileBuffer.ToString()
            if ([string]::IsNullOrWhiteSpace($profilePath)) { throw 'CreateProfile returned an empty profile path' }
            $localAppData = Join-Path $profilePath 'AppData/Local'
            $roamingAppData = Join-Path $profilePath 'AppData/Roaming'
            New-Item -ItemType Directory -Path $profilePath,$localAppData,$roamingAppData -Force | Out-Null
            New-Item -ItemType Directory -Path $stage -Force | Out-Null
            New-Item -ItemType Directory -Path $workspaceApp,$ownedApp,$workspacePipeApp,$centerApp,$fixture,$source,$task,$outside,$temp,(Join-Path $source 'src') -Force | Out-Null
            Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'tests/WorkspaceTransfer/bin/Release/net8.0-windows/*') -Destination $workspaceApp -Recurse -Force
            Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'tests/OwnedToolLaunch/bin/Release/net8.0-windows/*') -Destination $ownedApp -Recurse -Force
            Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'tests/WorkspacePipe/bin/Release/net8.0-windows/*') -Destination $workspacePipeApp -Recurse -Force
            Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE 'tests/CenterResults/bin/Release/net8.0-windows/*') -Destination $centerApp -Recurse -Force
            & icacls $stage /grant "${account}:(OI)(CI)RX" /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not grant the standard test account read/execute access to isolated test binaries' }
            & icacls $fixture /grant "${account}:(OI)(CI)M" /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not grant the standard test account workspace fixture access' }
            & icacls $temp /grant "${account}:(OI)(CI)M" /T /C | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Could not grant the standard test account temporary-directory access' }

            [System.IO.File]::WriteAllText((Join-Path $source 'src/main.txt'),'before',[System.Text.UTF8Encoding]::new($false))
            [System.IO.File]::WriteAllBytes((Join-Path $source 'raw.bin'),[byte[]]@(0,255,1,128))
            [System.IO.File]::WriteAllBytes((Join-Path $source 'empty.txt'),[byte[]]@())
            [System.IO.File]::WriteAllText((Join-Path $outside 'outside.txt'),'outside',[System.Text.UTF8Encoding]::new($false))
            New-Item -ItemType HardLink -Path (Join-Path $source 'hardlink.txt') -Target (Join-Path $outside 'outside.txt') -ErrorAction Stop | Out-Null
            $mkSourceJunction = 'mklink /J "{0}" "{1}"' -f $sourceRedirect,$outside
            & $env:ComSpec /d /c $mkSourceJunction
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the source reparse-point fixture' }
            $mkOutputJunction = 'mklink /J "{0}" "{1}"' -f $redirectOutput,$outside
            & $env:ComSpec /d /c $mkOutputJunction
            if ($LASTEXITCODE -ne 0) { throw 'Could not create the output reparse-point fixture' }

            function Invoke-StandardUserTest([string]$App,[string[]]$Arguments,[string]$Label) {
              $psi = [System.Diagnostics.ProcessStartInfo]::new()
              $psi.FileName = (Get-Command dotnet).Source
              foreach ($argument in $Arguments) { $psi.ArgumentList.Add($argument) }
              $psi.WorkingDirectory = $App
              $psi.UserName = $user
              $psi.Domain = $env:COMPUTERNAME
              $psi.Password = $password
              $psi.LoadUserProfile = $true
              $psi.UseShellExecute = $false
              $psi.CreateNoWindow = $true
              $psi.RedirectStandardOutput = $true
              $psi.RedirectStandardError = $true
              $psi.Environment['USERPROFILE'] = $profilePath
              $psi.Environment['LOCALAPPDATA'] = $localAppData
              $psi.Environment['APPDATA'] = $roamingAppData
              $psi.Environment['ProgramFiles'] = $env:ProgramFiles
              $psi.Environment['TEMP'] = $temp
              $psi.Environment['TMP'] = $temp
              $psi.Environment['DOTNET_CLI_HOME'] = $temp
              $psi.Environment['DOTNET_SKIP_FIRST_TIME_EXPERIENCE'] = '1'
              $psi.Environment['DOTNET_CLI_TELEMETRY_OPTOUT'] = '1'
              $process = [System.Diagnostics.Process]::Start($psi)
              $stdoutTask = $process.StandardOutput.ReadToEndAsync()
              $stderrTask = $process.StandardError.ReadToEndAsync()
              $process.WaitForExit()
              $stdout = $stdoutTask.GetAwaiter().GetResult()
              $stderr = $stderrTask.GetAwaiter().GetResult()
              Write-Host "===== $Label ====="
              if ($stdout) { Write-Host $stdout }
              if ($stderr) { Write-Host $stderr }
              if ($process.ExitCode -ne 0) { throw "$Label failed with exit code $($process.ExitCode)" }
            }

            Invoke-StandardUserTest $workspaceApp @('WorkspaceTransfer.dll',$fixture) 'WorkspaceTransfer contract and NTFS fixture tests'
            Invoke-StandardUserTest $ownedApp @('OwnedToolLaunch.dll','workspace-git-workflow-policy') 'Offline Git owner policy tests'
            $workspacePipeCases = @(
              'worker-feedback','frames','local-pipe','output','snapshot','token-membership',
              'reply','project-contract','privacy-contract','privacy-execution-gate',
              'caller-csharp','caller-data','project-failure'
            )
            foreach ($case in $workspacePipeCases) {
              Invoke-StandardUserTest $workspacePipeApp @('WorkspacePipe.dll',$case) "WorkspacePipe $case"
            }
            Invoke-StandardUserTest $centerApp @('CenterResults.dll') 'Protection Center workspace review and project-flow tests'
          }
          finally {
            if (Test-Path -LiteralPath $sourceRedirect) { & $env:ComSpec /d /c ('rmdir "{0}"' -f $sourceRedirect) | Out-Null }
            if (Test-Path -LiteralPath $redirectOutput) { & $env:ComSpec /d /c ('rmdir "{0}"' -f $redirectOutput) | Out-Null }
            Remove-LocalUser -Name $user -ErrorAction SilentlyContinue
            if ($profilePath -and (Test-Path $profilePath)) { Remove-Item $profilePath -Recurse -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stage) { Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue }
          }
